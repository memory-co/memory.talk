[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memorytalk"
version = "5.1.2"
description = "memory.talk v5 — work / collections / user 三个顶层对象的工作台:跑 code agent 的 work 树,git 分层的认知层,注册的团队成员"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "twwwwwy", email = "twwwwwy@gmail.com" }]
keywords = ["agent", "memory", "workspace", "tmux", "git", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",          # CLI 调本地 API
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/memory-co/memory.talk"
Repository = "https://github.com/memory-co/memory.talk"
Issues = "https://github.com/memory-co/memory.talk/issues"

[project.scripts]
# 引号:TOML 里裸的 memory.talk 会被当成嵌套表
"memory.talk" = "memorytalk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "test.py"]   # 场景住在 tests/<名字>/test.py
addopts = "--import-mode=importlib"

[tool.hatch.build]
# 前端构建产物(memorytalk/frontend/dist,`cd memorytalk/frontend && npm run build`)虽被 .gitignore,也要进 sdist 和 wheel:
# `python -m build` 先出 sdist、再从 sdist 出 wheel,所以 sdist 里没有 dist 的话 wheel 里也不会有
artifacts = ["memorytalk/frontend/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["memorytalk"]
# 前端源码不进 wheel
exclude = [
    "memorytalk/frontend/src",
    "memorytalk/frontend/apps",
    "memorytalk/frontend/public",
    "memorytalk/frontend/node_modules",
    "memorytalk/frontend/package*.json",
    "memorytalk/frontend/*.ts",
    "memorytalk/frontend/*.js",
    "memorytalk/frontend/index.html",
    "memorytalk/frontend/tsconfig.json",
    "memorytalk/frontend/.gitignore",
    "memorytalk/frontend/README.md",
]

[tool.hatch.build.targets.sdist]
exclude = ["memorytalk/frontend/node_modules"]
